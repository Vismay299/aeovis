name: CI

# On every push and every PR. The point of this workflow is that a red test
# stops being something you have to remember to run: before it existed, the
# package.json glob quietly excluded two files holding 57 tests, one of which
# had been failing since the design-system port and nobody could see it.
on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # No `continue-on-error` and no `|| true` anywhere in this file: a red
      # test must fail the job. That is the whole contract.
      - name: unit tests
        run: npm run test:scoring

      # The "is any test file orphaned by the glob?" guard is itself a test
      # (src/lib/testCoverageGuard.test.mjs), so it fails on a developer's
      # machine too rather than only in CI.

  # The fleet is a separate npm workspace with its own dependency set, and until
  # R1.2.19 this job did not exist: `npm --prefix worker test` matched no files
  # and CI never entered worker/, so the only automated check on the fleet was
  # the isolation guard running in the main suite. The worker-host ADR named
  # adding this as the deploy owner's job.
  fleet:
    name: fleet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - run: npm --prefix worker ci

      # Parses, then starts and completes one pass against stubs. Needs no
      # database, no browser and no credential — so a broken fleet fails here
      # rather than on the host.
      - name: fleet selftest
        run: npm --prefix worker run check

      # Builds the deploy image and runs the SAME selftest inside it. This is
      # what proves the Dockerfile before it reaches Zeabur: that the Playwright
      # system libraries install, that the browser matches the resolved library
      # version, and that tini + the node user can actually start the process.
      - name: build the fleet image
        run: docker build -t perceev-fleet:ci worker

      - name: selftest inside the image
        run: docker run --rm perceev-fleet:ci node src/index.js --selftest

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # `next build` needs the public Supabase vars to exist at module scope in
      # src/lib/db.js. Placeholders are enough to compile; nothing here makes a
      # live call, and no real credential belongs in a workflow file.
      - name: next build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
        run: npm run build
